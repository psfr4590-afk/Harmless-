name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package deployment artifact
        run: |
          tar -czf "harm-less-${GITHUB_REF_NAME}-dist.tar.gz" -C dist .
          sha256sum "harm-less-${GITHUB_REF_NAME}-dist.tar.gz" > "harm-less-${GITHUB_REF_NAME}-dist.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "harm-less-${GITHUB_REF_NAME}-dist.tar.gz"             "harm-less-${GITHUB_REF_NAME}-dist.tar.gz.sha256"             --title "Harm.Less ${GITHUB_REF_NAME}"             --generate-notes
