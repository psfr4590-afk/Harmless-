name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:release
      - name: Capture reproducible test evidence
        run: npm run test:tap > /tmp/harm-less-test.tap
      - name: Generate release evidence record
        env:
          GITHUB_SHA: ${{ github.sha }}
          TEST_LOG: /tmp/harm-less-test.tap
        run: npm run release:evidence
      - name: Package deployment artifact
        run: |
          tar -czf "harm-less-${GITHUB_REF_NAME}-dist.tar.gz" -C dist .
          sha256sum "harm-less-${GITHUB_REF_NAME}-dist.tar.gz" > "harm-less-${GITHUB_REF_NAME}-dist.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "harm-less-${GITHUB_REF_NAME}-dist.tar.gz" \
            "harm-less-${GITHUB_REF_NAME}-dist.tar.gz.sha256" \
            release-evidence.json \
            --title "Harm.Less ${GITHUB_REF_NAME}" \
            --generate-notes
