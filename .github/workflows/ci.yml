name: Verify
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run preview -- --host 127.0.0.1 > /tmp/harm-less-preview.log 2>&1 &
      - run: sleep 3
      - run: curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
